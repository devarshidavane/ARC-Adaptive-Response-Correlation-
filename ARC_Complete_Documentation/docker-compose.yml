version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: arc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arc_password}
      POSTGRES_DB: ${POSTGRES_DB:-arc}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arc_user} -d ${POSTGRES_DB:-arc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: arc-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arc-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-arc_user}:${POSTGRES_PASSWORD:-arc_password}@postgres:5432/${POSTGRES_DB:-arc}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # Background Workers
  detection-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arc-detection-worker
    command: ["python", "-m", "arc.workers.detection_worker"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-arc_user}:${POSTGRES_PASSWORD:-arc_password}@postgres:5432/${POSTGRES_DB:-arc}
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  correlation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arc-correlation-worker
    command: ["python", "-m", "arc.workers.correlation_worker"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-arc_user}:${POSTGRES_PASSWORD:-arc_password}@postgres:5432/${POSTGRES_DB:-arc}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arc-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
