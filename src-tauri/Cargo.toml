[package]
name = "arc-desktop"
version = "0.1.0"
description = "ARC Threat Intelligence Console Desktop Application"
authors = ["ARC Cybersecurity Team"]
license = "Proprietary"
repository = "https://github.com/arc/threat-intelligence"
edition = "2021"
rust-version = "1.70.0"
build = "build.rs"
default-run = "arc-desktop"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["dialog"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }

[features]
# By default Tauri runs in production mode.
# When `tauri dev` runs, it executes `cargo run --no-default-features` if `devPath` is a URL.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
